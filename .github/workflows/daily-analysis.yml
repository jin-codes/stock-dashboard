name: Daily Portfolio Analysis

on:
  schedule:
    # 22:00 UTC = 07:00 KST (next day)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INVESTMENT_PROFILE_MD: ${{ secrets.INVESTMENT_PROFILE_MD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write .env.local for scripts
        run: |
          cat > .env.local <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Write INVESTMENT_PROFILE.md
        if: ${{ env.INVESTMENT_PROFILE_MD != '' }}
        run: printf '%s' "$INVESTMENT_PROFILE_MD" > INVESTMENT_PROFILE.md

      - name: Run daily analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "/daily-analysis" --dangerously-skip-permissions

      # ---------------------------------------------------------------
      # Send the portfolio summary via KakaoTalk "message to me"
      #
      # Required GitHub Secrets:
      #   KAKAO_REST_API_KEY   - Kakao Developers > App Keys > REST API key
      #   KAKAO_CLIENT_SECRET  - Kakao Developers > Security > Client Secret
      #                          (skip this secret if it's disabled)
      #   KAKAO_REFRESH_TOKEN  - issued once via the OAuth authorization
      #                          code flow
      #
      # Note: the refresh_token expires roughly 2 months after issuance.
      # When it expires, the step below fails - log in again and refresh
      # KAKAO_REFRESH_TOKEN (continue-on-error means daily-analysis itself
      # still succeeds - the failure only shows as a warning in the
      # Actions log).
      # ---------------------------------------------------------------
      - name: Build Kakao summary message
        continue-on-error: true
        run: python scripts/build_kakao_summary.py > /tmp/kakao_message.txt

      - name: Send Kakao daily summary
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          curl -s -X POST "https://kauth.kakao.com/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded;charset=utf-8" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=${KAKAO_REST_API_KEY}" \
            --data-urlencode "client_secret=${KAKAO_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${KAKAO_REFRESH_TOKEN}" \
            -o /tmp/token_response.json

          ACCESS_TOKEN=$(python -c "import json; print(json.load(open('/tmp/token_response.json')).get('access_token',''))")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Failed to refresh the Kakao access token - refresh_token may have expired. Log in again and refresh KAKAO_REFRESH_TOKEN."
            cat /tmp/token_response.json
            exit 1
          fi

          python scripts/build_kakao_template.py

          curl -s -X POST "https://kapi.kakao.com/v2/api/talk/memo/default/send" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded;charset=utf-8" \
            --data-urlencode "template_object@/tmp/template_object.json" \
            -o /tmp/send_response.json

          grep -q '"result_code":0' /tmp/send_response.json || { echo "::warning::Failed to send the Kakao message"; cat /tmp/send_response.json; exit 1; }
